services:
  warp-1:
    image: ghcr.io/kingcc/warproxy:latest
    restart: unless-stopped
    environment:
      SOCKS5_PORT: '1080'
      HTTP_PORT: ''
    volumes:
      - warp-config-1:/config
    networks:
      - internal-1
  http-proxy-1:
    build: .
    restart: unless-stopped
    depends_on:
      - warp-1
    environment:
      PROXY_USER: ${PROXY_USER:?Set PROXY_USER in .env}
      PROXY_PASS: ${PROXY_PASS:?Set PROXY_PASS in .env}
      SOCKS_ADDR: warp-1:1080
      LISTEN_ADDR: ':8080'
    ports:
      - '${BIND_IP:-0.0.0.0}:40001:8080'
    networks:
      - internal-1
    security_opt:
      - no-new-privileges:true
